plugins {
    alias(libs.plugins.android.application)
}

// Only the public server address belongs in the APK. Never load a secret/API key here.
def cloudSettings = new Properties()
cloudSettings.load(new StringReader(providers.fileContents(rootProject.layout.projectDirectory.file('pas-cloud.properties')).asText.orElse('').get()))
if (cloudSettings.keySet().any { it != 'pasServerUrl' }) {
    throw new GradleException('pas-cloud.properties accepts only pasServerUrl. Do not put API keys in APK build settings.')
}
def configuredServerUrl = providers.gradleProperty('pasServerUrl').orElse(cloudSettings.getProperty('pasServerUrl', '')).get().trim()
if (!configuredServerUrl.isEmpty()) {
    def uri
    try { uri = new URI(configuredServerUrl) } catch (Exception ignored) { throw new GradleException('pasServerUrl must be a valid HTTPS origin.') }
    if (uri.scheme != 'https' || !uri.host || uri.userInfo || uri.query || uri.fragment || !(uri.path in ['', '/'])) {
        throw new GradleException('pasServerUrl must be https://host[:port], without credentials, path, query, or fragment. Local HTTP is entered only in the debug screen.')
    }
}

android {
    // Separate resource roots: keep filenames/R.drawable references and nodpi behavior unchanged.
    sourceSets {
        main {
            res.srcDirs += [
                'skills/hero', 'skills/hunter', 'skills/cleric', 'skills/wizard',
                'characters', 'skins/hero', 'skins/hunter', 'skins/cleric', 'skins/wizard',
                'skins/druid', 'skins/engineer', 'skins/bard', 'skins/exotic',
                'enemies', 'runes/primary', 'runes/secondary',
                'items/potions', 'items/elixirs', 'items/upgrades',
                'backgrounds/continents', 'backgrounds/battle', 'backgrounds/shop', 'placeholders'
            ].collect { 'src/main/res-art/' + it }
        }
    }
    namespace 'com.pas.game'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.pas.game"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"
        buildConfigField 'String', 'PAS_SERVER_URL', '"' + configuredServerUrl + '"'
        buildConfigField 'boolean', 'PAS_ONLINE_ENABLED', String.valueOf(!configuredServerUrl.isEmpty())

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures { buildConfig true }
    testOptions {
        unitTests.all {
            systemProperty 'pasTestServerUrl', providers.gradleProperty('pasTestServerUrl').orElse('').get()
        }
    }

    buildTypes {
        release {
            // The beta APK is shared outside Android Studio. Use the existing
            // Android Studio debug certificate so updates keep the same package
            // signature while release APKs remain installable (testOnly=false).
            signingConfig signingConfigs.debug
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.okhttp
    implementation libs.gson
    testImplementation libs.junit
    testImplementation libs.mockwebserver
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
